name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-installer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify installer payload
        run: |
          cd get_ha_recipe_manager
          sha256sum --check ha_recipe_manager.zip.sha256
          cd ..
          mkdir -p /tmp/ha-recipe-manager-payload
          unzip -q get_ha_recipe_manager/ha_recipe_manager.zip -d /tmp/ha-recipe-manager-payload
          diff -r custom_components/ha_recipe_manager /tmp/ha-recipe-manager-payload/custom_components/ha_recipe_manager
      - name: Check installer script
        run: shellcheck -s bash get_ha_recipe_manager/run.sh
      - name: Build installer image
        run: >-
          docker build
          --build-arg BUILD_VERSION=0.1.1
          --build-arg BUILD_ARCH=amd64
          get_ha_recipe_manager

  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  validate-hassfest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master
